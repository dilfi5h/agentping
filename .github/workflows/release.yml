name: Build & Release APK

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # 用固定 release keystore 签名（GH Secrets），保证各版本之间可覆盖安装
      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > agentping-release.keystore
          cat > keystore.properties <<EOF
          storeFile=agentping-release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build release APK
        run: gradle assembleRelease --no-daemon

      - name: Rename APK
        run: |
          test -s app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk \
             AgentPing-${{ github.ref_name }}.apk

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: AgentPing-${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          # verifyN tag 挂临时 prerelease，验收后删；正式 tag 出正式 release
          prerelease: ${{ contains(github.ref_name, 'verify') }}
          files: AgentPing-${{ github.ref_name }}.apk
