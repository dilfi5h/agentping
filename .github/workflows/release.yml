name: Build & Release APK

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Sign with the fixed release keystore (GH Secrets) so versions can be installed over each other without uninstalling
      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > agentping-release.keystore
          cat > keystore.properties <<EOF
          storeFile=agentping-release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build release APK
        run: gradle assembleRelease --no-daemon

      # Push to main → move the dev tag and publish the fixed prerelease channel (public download, same flow as PiPilot)
      - name: Publish to dev channel
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk AgentPing-dev.apk
          git config user.name "ci"
          git config user.email "ci@noreply.github.com"
          git tag -f dev
          git push -f origin dev
          gh release delete dev --repo dilfi5h/agentping --yes --cleanup-tag 2>/dev/null || true
          gh release create dev --repo dilfi5h/agentping --title "AgentPing dev" \
            --notes "Latest build from main (version unchanged, for verification)" --prerelease AgentPing-dev.apk

      - name: Rename APK
        if: startsWith(github.ref, 'refs/tags/')
        run: cp app/build/outputs/apk/release/app-release.apk AgentPing-${{ github.ref_name }}.apk

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: AgentPing-${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          # a verifyN tag carries a temporary prerelease, deleted after acceptance; a proper tag produces a proper release
          prerelease: ${{ contains(github.ref_name, 'verify') }}
          files: AgentPing-${{ github.ref_name }}.apk
